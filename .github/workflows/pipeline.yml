name: Practica 7 CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de despliegue"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
  schedule:
    - cron: "0 6 * * 1"
  repository_dispatch:
    types:
      - deploy-webhook

env:
  IMAGE_ALPINE: ${{ secrets.DOCKERHUB_USERNAME }}/practica7-cicd:alpine
  IMAGE_DEBIAN: ${{ secrets.DOCKERHUB_USERNAME }}/practica7-cicd:debian
  CONTAINER_NAME: practica7-cicd-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm run test:coverage

      - name: Subir informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

  security_scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escanear dependencias y sistema de archivos con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

  build_and_push_docker:
    runs-on: ubuntu-latest
    needs: security_scan
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Alpine
        run: docker build -f Dockerfile.alpine -t $IMAGE_ALPINE .

      - name: Construir imagen Debian
        run: docker build -f Dockerfile.debian -t $IMAGE_DEBIAN .

      - name: Subir imagen Alpine
        run: docker push $IMAGE_ALPINE

      - name: Subir imagen Debian
        run: docker push $IMAGE_DEBIAN

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_docker
    steps:
      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar en servidor
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            docker pull $IMAGE_ALPINE
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker run -d --name $CONTAINER_NAME -p 3000:3000 --restart unless-stopped $IMAGE_ALPINE
          "

  post_deploy_tests:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Comprobar endpoint health
        run: curl --fail http://${{ secrets.SERVER_HOST }}:3000/health

  notify:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - security_scan
      - build_and_push_docker
      - deploy
      - post_deploy_tests
    if: always()
    steps:
      - name: Enviar notificacion por email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Pipeline practica7-cicd: ${{ job.status }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            El pipeline de practica7-cicd ha terminado.
            Resultado global: ${{ job.status }}
            Repositorio: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Ejecucion: ${{ github.run_id }}
